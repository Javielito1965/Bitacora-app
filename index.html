<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cuaderno de Bitácora</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ============ LOGIN / REGISTRO ============ -->
<div id="authScreen">
  <div class="auth-card">
    <div class="auth-eyebrow">Cuaderno de bitácora</div>
    <h1>Acceso a la tripulación</h1>

    <div class="auth-tabs">
      <button class="active" data-auth="login">Iniciar sesión</button>
      <button data-auth="signup">Crear cuenta</button>
    </div>

    <div class="auth-error" id="authError"></div>
    <div class="auth-msg" id="authMsg"></div>

    <form class="auth-form active" id="form-login">
      <div class="field">
        <label>Correo electrónico</label>
        <input type="email" id="loginEmail" required>
      </div>
      <div class="field">
        <label>Contraseña</label>
        <input type="password" id="loginPassword" required>
      </div>
      <button class="primary" type="submit" id="loginBtn" style="width:100%">Entrar</button>
    </form>

    <form class="auth-form" id="form-signup">
      <div class="field">
        <label>Tu nombre</label>
        <input type="text" id="signupNombre" required>
      </div>
      <div class="field">
        <label>Correo electrónico</label>
        <input type="email" id="signupEmail" required>
      </div>
      <div class="field">
        <label>Contraseña</label>
        <input type="password" id="signupPassword" required minlength="6">
      </div>
      <button class="primary" type="submit" id="signupBtn" style="width:100%">Crear cuenta</button>
